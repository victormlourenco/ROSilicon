name: Wine runtime

# Builds the Wine runtime from the commit runtime-lock.json pins and the
# patches beside it, on Apple Silicon under Rosetta 2 (see
# tools/wine-runtime/build.sh), and uploads the archive with the
# artifact-lock.json that pins it. With publish set it also releases the
# archive as wine-runtime-r<runtimeRevision>; committing that lock is what
# points make restore at it.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Release the archive"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  runtime:
    runs-on: macos-26
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Install build tools
        run: brew install bison mingw-w64 freetype gnutls xz

      # The runtime artifact-lock.json pins now is the base of the new one:
      # its mtld3d and library overlays are assembled into it, and its x86_64
      # dylibs are what configure links against.
      - name: Restore the base runtime
        run: tools/wine-runtime/restore.sh --no-validate --runtime "$RUNNER_TEMP/base"

      - name: Fetch Wine
        run: tools/wine-runtime/fetch-source.sh --output "$RUNNER_TEMP/wine-src"

      - name: Build Wine
        run: >-
          tools/wine-runtime/build.sh
          --source "$RUNNER_TEMP/wine-src"
          --build "$RUNNER_TEMP/wine-build"
          --install "$RUNNER_TEMP/wine-install"
          --libs "$RUNNER_TEMP/base/lib/external"

      - name: Assemble the runtime
        run: >-
          tools/wine-runtime/assemble.sh
          --wine-root "$RUNNER_TEMP/wine-install"
          --mtld3d-root "$RUNNER_TEMP/base/lib"
          --external-root "$RUNNER_TEMP/base/lib/external"
          --output .wine-runtime

      - name: Package
        run: tools/wine-runtime/package.sh --runtime .wine-runtime

      - uses: actions/upload-artifact@v4
        with:
          name: wine-runtime
          path: |
            .build/runtime-artifacts/
            Packaging/WineRuntime/artifact-lock.json

      - name: Release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lock=Packaging/WineRuntime/artifact-lock.json
          tag="$(jq -er .releaseTag "$lock")"
          wine="$(jq -er '.wine.repository + " " + .wine.commit' Packaging/WineRuntime/runtime-lock.json)"
          gh release create "$tag" .build/runtime-artifacts/*.tar.xz* "$lock" \
            --target "$GITHUB_SHA" \
            --title "Wine runtime ${tag#wine-runtime-}" \
            --notes "Built from $wine with Packaging/WineRuntime/patches at $GITHUB_SHA."
